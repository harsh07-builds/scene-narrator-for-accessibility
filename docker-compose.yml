services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      SCENE_CONF_THRESHOLD: "0.5"
      SCENE_CORS_ORIGINS: "*"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
